name: Bug report
description: Report something that is broken or behaves unexpectedly.
labels: ['bug', 'triage']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem, including the exact error text if any.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: dropdown
    id: android-version
    attributes:
      label: Android version
      options:
        - Android 14+
        - Android 12–13
        - Android 8.0–11
        - Other
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings → About (or the APK file name).
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device model
      description: 'e.g. Pixel 8, Samsung S23, Xiaomi 13'
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Settings → Logs → Share (redact server addresses and subscription URLs).
